{% load static %}
<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olvidé mi contraseña · StockFlow</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Boostrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <script src="https://kit.fontawesome.com/5bb6ce43f9.js" crossorigin="anonymous"></script>

    <!-- Css -->
    <link rel="stylesheet" href="{% static 'css/variables.css' %}">
    <link rel="stylesheet" href="{% static 'css/layout.css' %}">
    <link rel="stylesheet" href="{% static 'css/components.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages/auth.css' %}">

    <!-- SweetAlert 2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Icon for app -->
    <link rel="icon" type="image/png" href="{% static "img/logo-icon.png" %}">
</head>
<body>
    <div class="bg-decor" aria-hidden="true"><span class="blob blob-1"></span><span class="blob blob-2"></span><span class="blob blob-3"></span></div>

    <div class="auth-screen">
        <div class="auth-card">
            <div class="auth-brand">
                <span class="brand-mark"><img src="{% static 'img/logo-icon.png' %}" alt="Logo"></span>
                <span class="brand-name">StockFlow</span>
            </div>
            <span class="section-label">Recuperar acceso</span>
            <h1>Olvidé mi contraseña</h1>
            <p class="subtitle">Escribí tu usuario. Le avisamos a la persona encargada de usuarios en tu empresa para que te asigne una nueva.</p>

            {% if messages %}
                <script>
                    document.addEventListener('DOMContentLoaded', function () {
                        const djangoMessages = [
                            {% for message in messages %}
                                { text: "{{ message|escapejs }}", tag: "{{ message.tags|default:'info'|escapejs }}" },
                            {% endfor %}
                        ];

                        const redirectUrl = "{{ redirect_url|default:''|escapejs }}";

                        djangoMessages.forEach(function (msg, index) {
                            let icon = 'info';
                            if (msg.tag.includes('danger')) icon = 'error';
                            else if (msg.tag.includes('success')) icon = 'success';
                            else if (msg.tag.includes('warning')) icon = 'warning';

                            Swal.fire({
                                icon: icon,
                                text: msg.text,
                                confirmButtonColor: '#1657D6',
                                allowEscapeKey: false,
                                allowOutsideClick: false,
                            }).then(function () {
                                if (index === djangoMessages.length - 1 && redirectUrl) {
                                    window.location.href = redirectUrl;
                                }
                            });
                        });
                    });
                </script>
            {% endif %}

            <form method="post" novalidate>
                {% csrf_token %}

                <div class="mb-3">
                    <label for="username" class="form-label">Usuario</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Tu nombre de usuario" required autofocus>
                </div>

                <button type="submit" class="btn btn-brand w-100 mt-2">
                    <i class="fa-solid fa-paper-plane"></i> Solicitar restablecimiento
                </button>

                <a href="{% url 'account:login' %}" class="btn btn-outline-brand w-100 mt-2">
                    <i class="fa-solid fa-arrow-left"></i> Volver a iniciar sesión
                </a>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
